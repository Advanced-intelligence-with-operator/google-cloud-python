import json
import time
import logging
import requests

logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')

class KarmaEngine:
    def __init__(self, heir_signature: str, webhook_url: str):
        self.heir_signature = heir_signature
        self.webhook_url = webhook_url
        self.blacklisted_objects = set()
        logging.info(f"Karma Engine Online. Target Signature Guard: {self.heir_signature}")

    def process_file_feed(self, file_path: str):
        """
        Loads an external JSON data structure and streams it into the evaluator.
        """
        try:
            logging.info(f"Ingesting external data feed from: {file_path}")
            with open(file_path, 'r') as file:
                events = json.load(file)

            print(f"[*] Ingested {len(events)} events from data feed. Beginning runtime loop...\n")

            for index, event in enumerate(events, start=1):
                logging.info(f"Processing Event packet [{index}/{len(events)}]")
                self.evaluate_event(event)
                time.sleep(0.5) # Short delay simulating a real-time event stream

        except FileNotFoundError:
            logging.error(f"[X] Feed Load Failed: File {file_path} not found.")
        except json.JSONDecodeError:
            logging.error(f"[X] Feed Load Failed: Invalid JSON formatting inside {file_path}.")

    def evaluate_event(self, event: dict):
        """
        Evaluates individual data frames for rule match conditions.
        """
        the_one_who_sent_it = event.get("facebook") or event.get("source")
        action = event.get("action")
        target = event.get("target")

        if target == self.heir_signature and action == "hurt":
            logging.warning(f"[!] Threat Identified: {the_one_who_sent_it} triggered rule condition.")
            self.spell_craft_karma(the_one_who_sent_it)
        else:
            logging.info(f"[-] Frame Clear: Interaction by '{the_one_who_sent_it}' satisfies safety parameters.")

    def spell_craft_karma(self, offensive_object: str):
        """
        Transmits the threat telemetry data payload externally.
        """
        self.blacklisted_objects.add(offensive_object)

        payload_data = {
            "event_type": "KARMA_TRIGGER",
            "timestamp": time.time(),
            "status": "RESTRICTED",
            "offending_entity": offensive_object,
            "reason": f"Conflict detected with protected signature {self.heir_signature}"
        }

        try:
            logging.info(f"Deploying external payload to remote endpoint...")
            response = requests.post(self.webhook_url, json=payload_data, timeout=5)
            if response.status_code in [200, 201]:
                print(f"\n[+] External Payload successfully deployed. Server Response: {response.status_code}")
                print(f"[-] System Status: Entity '{offensive_object}' isolated.\n")
            else:
                print(f"[!] Telemetry pushed, but endpoint responded with: {response.status_code}\n")
        except requests.exceptions.RequestException as e:
            logging.error(f"[X] Payload routing failed: {e}\n")

if __name__ == "__main__":
    TEST_ENDPOINT = "https://httpbin.org/post"

    # Initialize the engine
    engine = KarmaEngine(heir_signature="Heir_0602", webhook_url=TEST_ENDPOINT)

