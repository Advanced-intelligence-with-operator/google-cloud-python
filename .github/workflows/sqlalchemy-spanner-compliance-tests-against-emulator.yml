It looks like you accidentally pasted a chunk of **JSON settings** (VS Code configurations) and an **SSH configuration block (`~/.ssh/config`)** directly into your active **AL-SULTAN Shell** terminal prompt instead of editing your configuration files inside a text editor.

Because the shell is trying to execute every single line as a command, it is throwing "Command Not Found" and syntax errors.

---

### How to Fix This Right Now

1. **Stop pasting text directly into the terminal prompt.** The prompt (`~$`) expects shell commands (like `ls`, `cd`, `pm`), not code snippets or configuration text.
2. **Clear or exit the current input.** If you are stuck inside a multi-line quote or syntax error, press **`Ctrl + C`** on your keyboard to cancel the current command line.
3. **Fix your environment variable error** (which happened at startup):
```bash
unset PREFIX

```


4. **If you are trying to edit files:** Use a proper text editor (like `nano` or `vi` if installed, or whatever editor comes with your environment) rather than pasting configs directly into the bash prompt.

---

