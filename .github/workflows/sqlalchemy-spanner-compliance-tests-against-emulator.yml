we can conveniently find this distribution by using Gaussian identities, after finding the joint distribution over $\mathbf{f}_* = f(X_*)$ and $\mathbf{y}$. If we evaluate equation :eqref:`eq_gp-regression` at the training inputs $X$, we have $\mathbf{y} = \mathbf{f} + \mathbf{\epsilon}$. By the definition of a Gaussian process (see last section), $\mathbf{f} \sim \mathcal{N}(0,K(X,X))$ where $K(X,X)$ is an $n \times n$ matrix formed by evaluating our covariance function (aka _kernel_) at all possible pairs of inputs $x_i, x_j \in X$. $\mathbf{\epsilon}$ is simply a vector comprised of iid samples from $\mathcal{N}(0,\sigma^2)$ and thus has distribution $\mathcal{N}(0,\sigma^2I)$. $\mathbf{y}$ is therefore a sum of two independent multivariate Gaussian variables, and thus has distribution $\mathcal{N}(0, K(X,X) + \sigma^2I)$. One can also show that $\textrm{cov}(\mathbf{f}_*, \mathbf{y}) = \textrm{cov}(\mathbf{y},\mathbf{f}_*)^{\top} = K(X_*,X)$ where $K(X_*,X)$ is an $m \times n$ matrix formed by evaluating the kernel at all pairs of test and training inputs. $$\begin{bmatrix}\mathbf{y} \\\mathbf{f}_*\end{bmatrix}\sim\mathcal{N}\left(0, \mathbf{A} = \begin{bmatrix}K(X,X)+\sigma^2I & K(X,X_*) \\K(X_*,X) & K(X_*,X_*)\end{bmatrix}\right)$$$\mathbf{f}_* | \mathbf{y}, X, X_* \sim \mathcal{N}(m_*,S_*)$, where $m_* = K(X_*,X)[K(X,X)+\sigma^2I]^{-1}\textbf{y}$, and $S = K(X_*,X_*) - K(X_*,X)[K(X,X)+\sigma^2I]^{-1}K(X,X_*)$. matrix $S$, and  diagonal of $S$ for uncertainty  prediction point $x_*$,  of test points. The kernel matrix has parameters $\theta$ that we also wish to estimate, such the amplitude $a$ and lengthscale $\ell$ of the RBF kernel above. For these purposes we use the _marginal likelihood_, $p(\textbf{y} | \theta, X)$, which we already derived in working out the marginal distributions to find the joint distribution over $\textbf{y},\textbf{f}_*$. As we will see, the marginal likelihood compartmentalizes into model fit and model complexity terms, and automatically encodes a notion of Occam's razor for learning hyperparameters. For a full discussion, see MacKay Ch. 28 :cite:`mackay2003information`, and Rasmussen and Williams Ch. 5 :cite:`rasmussen2006gaussian`.```{.python .input}from d2l import torch as d2limport numpy as npfrom scipy.spatial import distance_matrixfrom scipy import optimizeimport matplotlib.pyplot as pltimport mathimport torchimport gpytorchimport osd2l.set_figsize()```## Equations for Making Predictions and Learning Kernel Hyperparameters in GP RegressionWe list here the equations you will use for learning hyperparameters and making predictions in Gaussian process regression. Again, we assume a vector of regression targets $\textbf{y}$, indexed by inputs $X = \{x_1,\dots,x_n\}$, and we wish to make a prediction at a test input $x_*$. We assume i.i.d. additive zero-mean Gaussian noise with variance $\sigma^2$. We use a Gaussian process prior $f(x) \sim \mathcal{GP}(m,k)$ for the latent noise-free function, with mean function $m$ and kernel function $k$. The kernel itself has parameters $\theta$ that we want to learn. For example, if we use an RBF kernel, $k(x_i,x_j) = a^2\exp\left(-\frac{1}{2\ell^2}||x-x'||^2\right)$, we want to learn $\theta = \{a^2, \ell^2\}$. Let $K(X,X)$ represent an $n \times n$ matrix corresponding to evaluating the kernel for all possible pairs of $n$ training inputs. Let $K(x_*,X)$ represent a $1 \times n$ vector formed by evaluating $k(x_*, x_i)$, $i=1,\dots,n$. Let $\mu$ be a mean vector formed by evaluating the mean function $m(x)$ at every training points $x$.Typically in working with Gaussian processes, we follow a two-step procedure. 1. Learn kernel hyperparameters $\hat{\theta}$ by maximizing the marginal likelihood with respect to these hyperparameters.2. Use the predictive mean as a point predictor, and 2 times the predictive standard deviation to form a 95\% credible set, conditioning on these learned hyperparameters $\hat{\theta}$.The log marginal likelihood is simply a log Gaussian density, which has the form:$$\log p(\textbf{y} | \theta, X) = -\frac{1}{2}\textbf{y}^{\top}[K_{\theta}(X,X) + \sigma^2I]^{-1}\textbf{y} - \frac{1}{2}\log|K_{\theta}(X,X)| + c$$The predictive distribution has the form:$$p(y_* | x_*, \textbf{y}, \theta) = \mathcal{N}(a_*,v_*)$$$$a_* = k_{\theta}(x_*,X)[K_{\theta}(X,X)+\sigma^2I]^{-1}(\textbf{y}-\mu) + \mu$$$$v_* = k_{\theta}(x_*,x_*) - K_{\theta}(x_*,X)[K_{\theta}(X,X)+\sigma^2I]^{-1}k_{\theta}(X,x_*)$$## Interpreting Equations for Learning and PredictionsThere are some key points to note about the predictive distributions for Gaussian processes:* Despite the flexibility of the model class, it is possible to do _exact_ Bayesian inference for GP regression in _closed form_. Aside from learning the kernel hyperparameters, there is no _training_. We can write down exactly what equations we want to use to make predictions. Gaussian processes are relatively exceptional in this respect, and it has greatly contributed to their convenience, versatility, and continued popularity. * The predictive mean $a_*$ is a linear combination of the training targets $\textbf{y}$, weighted by the kernel $k_{\theta}(x_*,X)[K_{\theta}(X,X)+\sigma^2I]^{-1}$. As we will see, the kernel (and its hyperparameters) thus plays a crucial role in the generalization properties of the model.* The predictive mean explicitly depends on the target values $\textbf{y}$ but the predictive variance does not. The predictive uncertainty instead grows as the test input $x_*$ moves away from the target locations $X$, as governed by the kernel function. However, uncertainty will implicitly depend on the values of the targets $\textbf{y}$ through the kernel hyperparameters $\theta$, which are learned from the data.* The marginal likelihood compartmentalizes into model fit and model complexity (log determinant) terms. The marginal likelihood tends to select for hyperparameters that provide the simplest fits that are still consistent with the data. * The key computational bottlenecks come from solving a linear system and computing a log determinant over an $n \times n$ symmetric positive definite matrix $K(X,X)$ for $n$ training points. Naively, these operations each incur $\mathcal{O}(n^3)$ computations, as well as $\mathcal{O}(n^2)$ storage for each entry of the kernel (covariance) matrix, often starting with a Cholesky decomposition. Historically, these bottlenecks have limited GPs to problems with fewer than about 10,000 training points, and have given GPs a reputation for "being slow" that has been inaccurate now for almost a decade. In advanced topics, we will discuss how GPs can be scaled to problems with millions of points.* For popular choices of kernel functions, $K(X,X)$ is often close to singular, which can cause numerical issues when performing Cholesky decompositions or other operations intended to solve linear systems. Fortunately, in regression we are often working with $K_{\theta}(X,X)+\sigma^2I$, such that the noise variance $\sigma^2$ gets added to the diagonal of $K(X,X)$, significantly improving its conditioning. If the noise variance is small, or we are doing noise free regression, it is common practice to add a small amount of "jitter" to the diagonal, on the order of $10^{-6}$, to improve conditioning.## Worked Example from ScratchLet's create some regression data, and then fit the data with a GP, implementing every step from scratch. We'll sample data from $$y(x) = \sin(x) + \frac{1}{2}\sin(4x) + \epsilon,$$ with $\epsilon \sim \mathcal{N}(0,\sigma^2)$. The noise free function we wish to find is $f(x) = \sin(x) + \frac{1}{2}\sin(4x)$. We'll start by using a noise standard deviation $\sigma = 0.25$.```{.python .input}def data_maker1(x, sig):    return np.sin(x) + 0.5 * np.sin(4 * x) + np.random.randn(x.shape[0]) * sigsig = 0.25train_x, test_x = np.linspace(0, 5, 50), np.linspace(0, 5, 500)train_y, test_y = data_maker1(train_x, sig=sig), data_maker1(test_x, sig=0.)d2l.plt.scatter(train_x, train_y)d2l.plt.plot(test_x, test_y)d2l.plt.xlabel("x", fontsize=20)d2l.plt.ylabel("Observations y", fontsize=20)d2l.plt.show()```Here we see the noisy observations as circles, and the noise-free function in blue that we wish to find. Now, let's specify a GP prior over the latent noise-free function, $f(x)\sim \mathcal{GP}(m,k)$. We'll use a mean function $m(x) = 0$, and an RBF covariance function (kernel)$$k(x_i,x_j) = a^2\exp\left(-\frac{1}{2\ell^2}||x-x'||^2\right).$$```{.python .input}mean = np.zeros(test_x.shape[0])cov = d2l.rbfkernel(test_x, test_x, ls=0.2)```We have started with a length-scale of 0.2. Before we fit the data, it is important to consider whether we have specified a reasonable prior. Let's visualize some sample functions from this prior, as well as the 95\% credible set (we believe there's a 95\% chance that the true function is within this region).```{.python .input}prior_samples = np.random.multivariate_normal(mean=mean, cov=cov, size=5)d2l.plt.plot(test_x, prior_samples.T, color='black', alpha=0.5)d2l.plt.plot(test_x, mean, linewidth=2.)d2l.plt.fill_between(test_x, mean - 2 * np.diag(cov), mean + 2 * np.diag(cov),                  alpha=0.25)d2l.plt.show()`` $x_*$.$$\bar{f}_{*} = K(x, x_*)^T (K(x, x) + \sigma^2 I)^{-1}y$$$$V(f_{*}) = K(x_*, x_*) - K(x, x_*)^T (K(x, x) + \sigma^2 I)^{-1}K(x, x_*)$$ learn our kernel hyperparameters $\theta$ and noise variance $\sigma^2$. Let's initialize our length-scale at 0.75, as our prior functions looked too quickly varying compared to the data we are fitting. We'll also guess a noise standard deviation $\sigma$ of 0.75. $$\log p(y | X) = \log \int p(y | f, X)p(f | X)df$$$$\log p(y | X) = -\frac{1}{2}y^T(K(x, x) + \sigma^2 I)^{-1}y - \frac{1}{2}\log |K(x, x) + \sigma^2 I| - \frac{n}{2}\log 2\pi$$Perhaps our prior functions were too quickly varying. Let's guess a length-scale of 0.4. We'll also guess a noise standard deviation of 0.75. These are simply hyperparameter initializations --- we will learn these parameters from the marginal likelihood.```{.python .input}ell_est = 0.4post_sig_est = 0.5def neg_MLL(pars):    K = d2l.rbfkernel(train_x, train_x, ls=pars[0])    kernel_term = -0.5 * train_y @ \        np.linalg.inv(K + pars[1] ** 2 * np.eye(train_x.shape[0])) @ train_y    logdet = -0.5 * np.log(np.linalg.det(K + pars[1] ** 2 * \                                         np.eye(train_x.shape[0])))    const = -train_x.shape[0] / 2. * np.log(2 * np.pi)        return -(kernel_term + logdet + const)learned_hypers = optimize.minimize(neg_MLL, x0=np.array([ell_est,post_sig_est]),                                    bounds=((0.01, 10.), (0.01, 10.)))ell = learned_hypers.x[0]post_sig_est = learned_hypers.x[1]```In this instance, we learn a length-scale of 0.299, and a noise standard deviation of 0.24. Note that the learned noise is extremely close to the true noise, which helps indicate that our GP is a very well-specified to this problem. In general, it is crucial to put careful thought into selecting the kernel and initializing the hyperparameters. While marginal likelihood optimization can be relatively robust to initialization, it is not immune to poor initializations. Try running the above script with a variety of initializations and see what results you find.Now, let's make predictions with these learned hypers.```{.python .input}K_x_xstar = d2l.rbfkernel(train_x, test_x, ls=ell)K_x_x = d2l.rbfkernel(train_x, train_x, ls=ell)K_xstar_xstar = d2l.rbfkernel(test_x, test_x, ls=ell)post_mean = K_x_xstar.T @ np.linalg.inv((K_x_x + \                post_sig_est ** 2 * np.eye(train_x.shape[0]))) @ train_ypost_cov = K_xstar_xstar - K_x_xstar.T @ np.linalg.inv((K_x_x + \                post_sig_est ** 2 * np.eye(train_x.shape[0]))) @ K_x_xstarlw_bd = post_mean - 2 * np.sqrt(np.diag(post_cov))up_bd = post_mean + 2 * np.sqrt(np.diag(post_cov))d2l.plt.scatter(train_x, train_y)d2l.plt.plot(test_x, test_y, linewidth=2.)d2l.plt.plot(test_x, post_mean, linewidth=2.)d2l.plt.fill_between(test_x, lw_bd, up_bd, alpha=0.25)d2l.plt.legend(['Observed Data', 'True Function', 'Predictive Mean', '95% Set on True Func'])d2l.plt.show()latent _noise free_(true){.python .input}lw_bd_observed = post_mean - 2 * np.sqrt(np.diag(post_cov) + post_sig_est 2)up_bd_observed = post_mean + 2 * np.sqrt(np.diag(post_cov) + post_sig _epistemic_ uncertainty, representing _reducible_ uncertainty, and _aleatoric_ or _irreducible_uncertainty_aleatoric_epistemic_np.diag(post\_cov)_aleatoric_post_sig_A_two_root{.python .input}post_samples =np.random.multivariate_normal(post_mean, post_cov, size=20)d2l.plt.scatter(train_x, train_y)d2l.plt.plot(test_x, test_y,linewidth=2.)d2l.plt.plot(test_x, post_mean, linewidth=2.)d2l.plt.plot(test_x, post_samples.T, color='gray', alpha=0.25)d2l.plt.fill_between(test_x, lw_bd, up_bd, alpha=0.25)plt.legend(['Observed Data', 'True Function', 'Predictive Mean', 'Posterior Samples'])d2l.plt.show(). # GPyTorch kernel GP SKI (KISS-GP), the _GPyTorch_ llibrary contains [many](https://github.com/cornellius-gp/gpytorch/tree/master/examples). To get [simple regression example](https://github.com/cornellius-gp/gpytorch/blob/master/examples/01_Exact_GPs/Simple_GP_Regression.ipynb).```{.python .input}#data PyTorchtrain_x = torch.tensor(train_x)train_y = torch.tensor(train_y)test_y = torch.tensor(test_y)        self.mean_module = gpytorch.means.ZeroMean()        self.covar_module = gpytorch.kernels.ScaleKernel(            gpytorch.kernels.RBFKernel())        def forward(self, x):        mean_x = self.mean_module(x)        covar_x = self.covar_module(x)        return gpytorch.distributions.MultivariateNormal(mean_x, covar_x)```.```{.python .input}# Initialize Gaussian likelihoodlikelihood = gpytorch.likelihoods.GaussianLikelihood()model = ExactGPModel(train_x, train_y, likelihood)training_iter = 50```{.python .input}for i in range(training_iter):    # Zero gradients from previous iteration    optimizer.zero_grad()    # Output from model    output = model(train