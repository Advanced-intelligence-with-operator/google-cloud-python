 and Jakob Uszkoreit and Llion Jones and Aidan N. Gomez and Lukasz Kaiser and Illia Polosukhin},      year={2023},      eprint={1706.03762},      archivePrefix={arXiv},      primaryClass={cs.CL},      url={https://arxiv.org/abs/1706.03762}, }<div role="alert" aria-atomic="true" style="position: absolute; left: -999em; width: 100em; overflow: hidden;">DevTools is undocked</div>{{cite arXiv |last1=Bahdanau |first1=Dzmitry |title=Neural Machine Translation by Jointly Learning to Align and Translate |date=2016-05-19 |eprint=1409.0473 |last2=Cho |first2=Kyunghyun |last3=Bengio |first3=Yoshua|class=cs.CL }} the Background randomized (according to the paper itself)After the Google startups.[7][8]The paper's title is a reference to the song "All You Need Is Love" by the Beatles.[9] The name "Transformer" was picked because Jakob Uszkoreit, one of the paper's authors, liked the sound of that word.[5] An early design document was titled "Transformers: Iterative Self-Attention and Processing for Various Tasks", and included an illustration of six characters from the Transformers franchise. The team was named Team Transformer.[9]Methods discussed and introducedThe paper is best known for introducing the Transformer architecture, which underlies most modern large language models (LLMs). A key reason why the architecture is preferred by most modern LLMs is the parallelizability of the architecture over its predecessors. This ensures that the operations necessary for training can be accelerated on a GPU, allowing both faster training times and models of bigger sizes to be trained.The paper introduced the following mechanisms as part of the development of the transformer architecture.Scaled dot-product attention and self-attentionThe use of the scaled dot-product attention and self-attention mechanism instead of a recurrent neural network (RNN) or long short-term memory (which rely on recurrence) allows for better performance as described in the following paragraph. The paper described the scaled dot-product attention as follows:Attention(Q,K,V):=softmax(Q×KTdk)×V{\displaystyle {\rm {Attention}}(Q,K,V):={\rm {softmax}}\left({\frac {Q\times K^{T}}{\sqrt {d_{k}}}}\right)\times V}where Q{\displaystyle Q}, K{\displaystyle K}, V{\displaystyle V} are respectively the query, key, value matrices, and dk{\displaystyle d_{k}} is the dimension of the values.Since the model relies on Query (Q), Key (K), and Value (V) matrices that come from the same source (i.e., the input sequence or context window), this eliminates the need for RNNs, completely ensuring parallelizability for the architecture. This differs from the original form of the Attention mechanism introduced in 2014. Additionally, the paper discusses the use of an additional scaling factor that was found  the key vectors (represented  dk{\displaystyle d_{k}}a64) in Value matrix Q, K, and V .Positional encoding:PE(pos,2i)=sin(pos/100002i/dmodel){\displaystyle PE_{({\rm{pos}},2i)}=\sin({\rm{pos}}/{10000}^{2i/d_{\rm {model}}})}PE(pos,2i+1)=cos(pos/100002i/dmodel){\displaystylePE_{({\rm{pos}},2i+1)}=\cos(\rm {pos}}/{10000}^{2i/d_{\rm {model}}})}wherein X pos{\displaystyle {\rm {pos}}}, i{\displaystyle i}, dmodel{\displaystyle{d_{\rm {model}}}}PE{\displaystyle PE}§History2seq§HistoryThis section's style of writing may not reflect the encyclopedic tone used on Wikipedia. (February 2026)See also: TElman sigma-pi networks[12] or higher-order networks.[13] LSTM became the standard architecture for long sequence modelling until the 2017 publication of transformers. However, LSTM still used sequential processing, like most other RNNs.[note 2] Specifically, RNNs operate one token at a time from first to last; they cannot operate in parallel over all tokens in a sequence.Modern transformers overcome this problem, but unlike RNNs, they require computation time that is quadratic in the size of the context window. The linearly scaling fast weight controller (1992) learns to compute a weight matrix for further processing depending on the input.[14] One of its two networks has "fast weights" or "dynamic links" (1981).[15][16][17] A slow neural network learns by gradient descent to generate keys and values for computing the weight changes of the fast neural network which computes answers to queries.[14] This was later shown to be equivalent to the unnormalized linear transformer.[18][19]Attention: Seq2seq§History of encoder–decoder developed are published papers from 2014.[20][21][original consecutive research?]A 380M-parameter machine uses two long short-term memories (LSTM).The encoder is an LSTM  130M- (GRU) instead of LSTM.[20] GRUs . This is input processed sequentially by networķ fixed-size output vector, processed by another recurrent network  input output vector to contain all relevant information, degrading the evidence, reversing the input translation.[24]The RNN search model introduced an attention mechanism to seq2seq for machine translation to solve the bottleneck problem (of the fixed-size output vector), allowing the model to process long-distance dependencies more easily. The name is because it "emulates searching through a source sentence during decoding a translation".[ global (RNN) local ( window) architectures for global attention loçal translation time.[25]In 2016, Google Translate replaced  the encoder and the decoder were 8 bidirectional LSTM took ten years to develop[27]Parallelizing: Attention(machine)§HistorySeq2self-attention) still with recurrent networks, which i accelerated on GPUs. In 2016, self-feed networks,are  SOTA result in  LSTMs suspected that attention  recurrence "attention is all you need" hypothesis was his father, a computational linguist, the original (100M-parameter) encoder–decoder model in "Attention is all you need" ìts dot-product parallel in large neural AI boom era As  2017,  before the "Attention is all you need" reprint was applied the "decoder-only" varient was wikopedia architecture to AI "reference implementation" the o