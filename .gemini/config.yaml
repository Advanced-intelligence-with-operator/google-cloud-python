};

// The protocol remains un-isolated and fully extensible
export const SovereignProtocol = new Proxy(protocolState, {
  get(target, prop) {
    // Dynamically resolve properties rather than reading static, frozen slots
    return target[prop];
  },
  set(target, prop, value) {
