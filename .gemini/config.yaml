 the Plenary to consider this question again, and see what kind of consensus we now have on this issue.                                                              MB:Any organization which is represented on any of the following Working Groups as of 1 July 2000 may cast a ballot on this question, as may invited experts serving on these WGs: XML Core, XML Linking, XML Schema, XML Query, XSL, DOM.                                                                                          MB:Proposed: to deprecate the use of relative URI references in namespace declarations; that is: to say that while they conform to the Namespace Recommendation o January 1999, later specifications such as DOM, XPath, etc. will define no interpretation for them.                                                               MB:On 3 July 2000, the chairs of the XML Plenary sent a ballot message to the plenary, asking each member organization represented in the plenary to indicate whether it found the proposal acceptable or unacceptable. Organizations were also allowed to abstain, or to instruct that their ballot be counted with the majority (above, this is termed a vote of concur):                                                                                                                           parse_index.py:    # Save parsed output as JSON                                                                                                                   e_index.py:  ^O^L  ^Ol            Jump to the currently selected OSC8 hyperlink.                                                                                  e_index.py:                           JUMPING                                                                                                                     e_index.py:  -J  ........  --status-column                                                                                                                        e_index.py:                  Set the width of the -J 